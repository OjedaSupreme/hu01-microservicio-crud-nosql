# Configuracion del analisis SonarQube de la HU-01.
#
# - Con Maven (recomendado): "mvnw.cmd clean verify sonar:sonar" usa las mismas
#   claves, declaradas como propiedades en pom.xml.
# - Con SonarScanner CLI: este archivo se lee directamente. Ejecuta antes
#   "mvnw.cmd clean verify" para generar las clases y el XML de JaCoCo.
#
# El token NO se guarda aqui: pasalo con la variable de entorno SONAR_TOKEN
# o con -Dsonar.token=...

sonar.projectKey=hu01-microservicio-crud-nosql
sonar.projectName=HU-01 Microservicio CRUD NoSQL
sonar.projectVersion=0.0.1-SNAPSHOT
sonar.host.url=http://localhost:9000

sonar.sourceEncoding=UTF-8
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.source=21
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

sonar.junit.reportPaths=target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=**/*Application.java
