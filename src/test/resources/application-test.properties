# Perfil "test": las pruebas de integracion usan un MongoDB embebido (flapdoodle),
# asi que no necesitan Docker ni un MongoDB instalado.
#
# La version es obligatoria: sin ella la autoconfiguracion de flapdoodle no arranca.
# El binario se descarga la primera vez y queda en cache en ~/.embedmongo.
de.flapdoodle.mongodb.embedded.version=7.0.28

# Aqui NO se fija spring.mongodb.uri: flapdoodle levanta mongod en un puerto libre
# y sobrescribe host, puerto y URI para que el cliente apunte al embebido.
