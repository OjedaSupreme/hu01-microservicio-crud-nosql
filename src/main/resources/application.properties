spring.application.name=hu01-estudiantes
server.port=${SERVER_PORT:8080}

# MongoDB. En Spring Boot 4 la propiedad se llama spring.mongodb.uri (antes
# spring.data.mongodb.uri). Si la base exige usuario y clave, define la variable
# de entorno MONGODB_URI: las credenciales nunca se escriben en este archivo.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/estudiantes}

# Crea al arrancar el indice unico declarado con @Indexed en el correo.
spring.data.mongodb.auto-index-creation=true

# El cliente nunca recibe trazas ni mensajes internos del servidor.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Swagger UI: http://localhost:8080/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
