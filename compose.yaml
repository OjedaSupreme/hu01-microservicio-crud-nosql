# Entorno LOCAL de desarrollo para la HU-01.
#
#   docker compose up -d mongo        -> MongoDB para ejecutar el microservicio
name: hu01-estudiantes

services:
  mongo:
    image: mongo:7
    container_name: hu01-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
